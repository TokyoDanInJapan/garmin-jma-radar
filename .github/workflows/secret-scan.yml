name: secret-scan

# Scan every push and PR for committed secrets (the proxy token, Cloudflare
# credentials, etc). Runs on all paths – unlike proxy.yml, which is scoped to
# proxy/** – because the highest-risk leak vector is a proxy token pasted into a
# tracked file such as radar-widget/resources/shared/properties.xml.
#
# push is limited to main: a branch with a PR is scanned by pull_request, and
# scanning it on push as well only ran the same job twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full commit history, so a secret in any past commit is caught
          persist-credentials: false

      # Checked against the SHA-256 from the release's checksums file before it
      # is unpacked. Bump both together.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1   # keep in sync with .pre-commit-config.yaml
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan commit history
        run: gitleaks git . --redact --verbose --config .gitleaks.toml
