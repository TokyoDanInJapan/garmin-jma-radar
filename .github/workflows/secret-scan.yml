name: secret-scan

# Scan every push and PR for committed secrets (the proxy token, Cloudflare
# credentials, etc). Runs on all paths -- unlike proxy.yml, which is scoped to
# proxy/** -- because the highest-risk leak vector is build.sh baking the proxy
# token into radar-widget/resources/shared/properties.xml.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0          # full commit history, so a secret in any past commit is caught

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1   # keep in sync with .pre-commit-config.yaml
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan commit history
        run: gitleaks git . --redact --verbose --config .gitleaks.toml
