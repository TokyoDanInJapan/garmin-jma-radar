name: release

# Tag a release and attach the built widget packages, so there is a record of
# which commit is on a device or in the Connect IQ Store. The proxy is not
# versioned this way -- it deploys continuously from main.
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. v0.2.0)'
        required: true

permissions:
  contents: read

env:
  CIQ_SDK_VERSION: '9.2.0'

jobs:
  release:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    permissions:
      contents: write      # create the release and upload assets
    # Container jobs default to `sh -e {0}`, not bash; the steps below use
    # `[[ ]]` and `set -o pipefail`.
    defaults:
      run:
        shell: bash
    env:
      # See widgets.yml: monkeyc resolves its SDK/device root to /root, while
      # container jobs default HOME to /github/home.
      HOME: /root

    steps:
      - name: Install toolchain dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git jq unzip openssl openjdk-17-jre-headless
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.Garmin/ConnectIQ/Sdks
            ~/.Garmin/ConnectIQ/Devices
          key: ciq-${{ env.CIQ_SDK_VERSION }}-${{ hashFiles('.github/scripts/install-connectiq.sh') }}

      - name: Install Connect IQ toolchain
        run: .github/scripts/install-connectiq.sh edge1030plus edge1040

      - name: Add SDK to PATH
        run: echo "$(cat ~/.Garmin/ConnectIQ/current-sdk.cfg)/bin" >> "$GITHUB_PATH"

      # A Connect IQ Store listing is bound to the developer key that first
      # published it, so a Store-uploadable .iq must be signed with the real one.
      # With the secret set we produce exactly that; without it we still build,
      # but only for sideloading -- and say so in the release notes rather than
      # shipping something that looks Store-ready and isn't.
      - name: Resolve signing key
        id: key
        env:
          DEVELOPER_KEY: ${{ secrets.GARMIN_DEVELOPER_KEY }}
        run: |
          if [[ -n "$DEVELOPER_KEY" ]]; then
            printf '%s' "$DEVELOPER_KEY" | base64 -d > /tmp/release-key.der
            echo "path=/tmp/release-key.der" >> "$GITHUB_OUTPUT"
            echo "store_ready=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the repository developer key."
          else
            echo "path=$HOME/.Garmin/ConnectIQ/ci-key.der" >> "$GITHUB_OUTPUT"
            echo "store_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GARMIN_DEVELOPER_KEY is not set; packages are sideload-only."
          fi

      # Two artifact kinds, because they serve different people:
      #
      #   <widget>-<device>.prg  sideload. Copy onto the Edge over USB
      #                          (GARMIN/APPS) or load in the simulator. Works
      #                          with any developer key, so CI's ephemeral one
      #                          is fine.
      #   <widget>.iq            Connect IQ Store bundle. Only useful when
      #                          signed with the key that published the
      #                          listing, and not sideloadable.
      #
      # Attaching only the .iq -- which is what this workflow did originally --
      # produces a release nobody can use without the signing secret: wrong key
      # for the Store, wrong format for sideloading.
      - name: Build release packages
        env:
          KEY: ${{ steps.key.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for widget in radar-widget speedtest-widget; do
            devices=$(sed -nE 's/.*<iq:product id="([^"]+)".*/\1/p' "$widget/manifest.xml")
            for device in $devices; do
              echo "::group::$widget -> $device (.prg)"
              (cd "$widget" && monkeyc -d "$device" -r -w -l 1 -f monkey.jungle \
                 -o "../dist/$widget-$device.prg" -y "$KEY")
              echo "::endgroup::"
            done
            echo "::group::$widget (.iq store bundle)"
            (cd "$widget" && monkeyc -e -r -w -l 1 -f monkey.jungle \
               -o "../dist/$widget.iq" -y "$KEY")
            echo "::endgroup::"
          done
          ls -la dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          STORE_READY: ${{ steps.key.outputs.store_ready }}
        run: |
          set -euo pipefail
          if [[ "$STORE_READY" == "true" ]]; then
            iq_note='Signed with the project developer key, so it can be uploaded to the Connect IQ Store.'
          else
            iq_note='Built with an ephemeral CI key because the GARMIN_DEVELOPER_KEY secret is not set, so it **cannot** be uploaded to the Store as an update to an existing listing. The .prg files above are unaffected.'
          fi
          {
            echo "Widget builds from \`$TAG\`."
            echo
            echo "### Install on a device"
            echo
            echo "Download the \`.prg\` for your Edge and copy it to \`GARMIN/APPS\`"
            echo "over USB, then eject. Sideloaded builds are signed with a"
            echo "throwaway key; that is fine for the device and does not affect"
            echo "a Store install of the same app."
            echo
            echo "You still need to set the proxy URL and key in the widget's"
            echo "settings -- these builds have no credentials baked in."
            echo
            echo "### Store bundle"
            echo
            echo "\`*.iq\` is the Connect IQ Store package, not a sideloadable file."
            echo "$iq_note"
            echo
            echo "\`*.prg.debug.xml\` is the symbol map for the matching build."
            echo "Attach it to a bug report if the app crashes -- a release build"
            echo "strips debug info, so the stack trace in \`GARMIN/APPS/LOGS/CIQ_LOG.YML\`"
            echo "cannot be decoded without it."
            echo
            echo "See [CHANGELOG.md](CHANGELOG.md) for what changed."
          } > /tmp/notes.md

          # Explicit globs, not dist/*: the .prg build also drops a
          # <name>-settings.json next to each binary, which is build scaffolding
          # nobody downloads. The .prg.debug.xml is kept deliberately -- it is
          # the symbol map for that exact build, and a release .prg (-r strips
          # debug info) produces stack traces in CIQ_LOG.YML that cannot be
          # decoded without it. It is not reproducible after the fact.
          shopt -s nullglob
          assets=(dist/*.prg dist/*.iq dist/*.prg.debug.xml)
          printf 'Attaching %d assets:\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"

          # Idempotent: re-running workflow_dispatch on the same tag replaces assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" --notes-file /tmp/notes.md
          fi
