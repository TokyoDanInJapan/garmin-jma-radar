name: release

# Tag a release and attach the built widget packages, so there is a record of
# which commit is on a device or in the Connect IQ Store. The proxy is not
# versioned this way – it deploys continuously from main.
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for, for example v0.2.0'
        required: true

permissions:
  contents: read

# One release run per tag at a time. A re-run waits rather than races.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Split from `publish` because the build needs the container and the release
  # needs the runner. `gh` ships in the hosted runner image but not in
  # ubuntu:22.04, so calling `gh release create` from in here fails with 127.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GARMIN_DEVELOPER_KEY lives in this environment, not in the repository
    # secrets. Give the environment a deployment rule that allows only v* tags,
    # so a workflow edited on a branch can't read the key that signs Store
    # uploads. See CONTRIBUTING.md, "Releases".
    environment: release
    # Pinned by digest. See widgets.yml.
    container: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    outputs:
      store_ready: ${{ steps.key.outputs.store_ready }}
    # Container jobs default to `sh -e {0}`, not bash. The steps below use
    # `[[ ]]` and `set -o pipefail`.
    defaults:
      run:
        shell: bash
    env:
      # See widgets.yml: monkeyc resolves its SDK/device root to /root, while
      # container jobs default HOME to /github/home.
      HOME: /root

    steps:
      - name: Install toolchain dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git jq unzip openssl openjdk-17-jre-headless \
            libwebkit2gtk-4.0-37 libusb-1.0-0 libsm6 xvfb procps
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0              # the tag check below needs main's history
          persist-credentials: false

      # A manual run takes any ref as its input. Refuse anything but a tag on
      # main that the CHANGELOG describes, so the assets, the tag and the notes
      # always name the same commit.
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::$TAG is not a tag"; exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main; then
            echo "::error::$TAG is not on main"; exit 1
          fi
          if ! grep -qE "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG#v}]' section"; exit 1
          fi

      - uses: ./.github/actions/setup-connectiq
        with:
          cache: 'false'

      # The same tests widgets.yml runs, so a tag on a commit whose CI never
      # finished can't publish a broken build.
      - name: Run Monkey C unit tests
        run: .github/scripts/test-widgets.sh ~/.Garmin/ConnectIQ/ci-key.der

      # A Connect IQ Store listing is bound to the developer key that first
      # published it, so a Store-uploadable .iq must be signed with the real one.
      # With the secret set we produce exactly that. Without it we still build,
      # but only for sideloading – and say so in the release notes rather than
      # shipping something that looks Store-ready and isn't.
      - name: Resolve signing key
        id: key
        env:
          DEVELOPER_KEY: ${{ secrets.GARMIN_DEVELOPER_KEY }}
        run: |
          if [[ -n "$DEVELOPER_KEY" ]]; then
            # Owner-only, in the job's own temp folder, and deleted by the
            # cleanup step below whatever happens.
            key="$RUNNER_TEMP/release-key.der"
            (umask 077 && printf '%s' "$DEVELOPER_KEY" | base64 -d > "$key")
            echo "path=$key" >> "$GITHUB_OUTPUT"
            echo "store_ready=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the repository developer key."
          else
            echo "path=$HOME/.Garmin/ConnectIQ/ci-key.der" >> "$GITHUB_OUTPUT"
            echo "store_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GARMIN_DEVELOPER_KEY is not set; packages are sideload-only."
          fi

      # Two artifact kinds, because they serve different people:
      #
      #   <widget>-<device>.prg  sideload. Copy onto the Edge over USB
      #                          (GARMIN/APPS) or load in the simulator. Works
      #                          with any developer key, so CI's ephemeral one
      #                          is fine.
      #   <widget>.iq            Connect IQ Store bundle. Only useful when
      #                          signed with the key that published the
      #                          listing, and not sideloadable.
      #
      # Attaching only the .iq – which is what this workflow did originally –
      # produces a release nobody can use without the signing secret: wrong key
      # for the Store, wrong format for sideloading.
      - name: Build release packages
        env:
          KEY: ${{ steps.key.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for widget in radar-widget speedtest-widget; do
            devices=$(sed -nE 's/.*<iq:product id="([^"]+)".*/\1/p' "$widget/manifest.xml")
            for device in $devices; do
              echo "::group::$widget -> $device (.prg)"
              (cd "$widget" && monkeyc -d "$device" -r -w -l 1 -f monkey.jungle \
                 -o "../dist/$widget-$device.prg" -y "$KEY")
              echo "::endgroup::"
            done
            echo "::group::$widget (.iq store bundle)"
            (cd "$widget" && monkeyc -e -r -w -l 1 -f monkey.jungle \
               -o "../dist/$widget.iq" -y "$KEY")
            echo "::endgroup::"
          done
          ls -la dist

      # Release assets are public and permanent. build.sh bakes PROXY_KEY from
      # .env straight into the .prg and the generated -settings.json (confirmed
      # by baking a sentinel token and finding it in both), so publishing a
      # wrongly-built artifact would disclose the shared secret gating /frames
      # and /tile. This job calls monkeyc directly and CI has no .env, so the
      # baked default is empty – assert it before upload rather than trust it.
      - name: Assert no proxy credential is baked in
        run: .github/scripts/assert-no-credentials.sh dist

      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.der"

      # Explicit globs, not the whole of dist/: the .prg build also drops a
      # <name>-settings.json next to each binary, which is build scaffolding
      # nobody downloads. Listing the three release kinds keeps that scaffolding
      # out of the artifact as well as out of the release.
      - name: Hand the packages to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: |
            dist/*.prg
            dist/*.iq
            dist/*.prg.debug.xml
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest    # no container, so the runner's `gh` is on PATH
    timeout-minutes: 10
    permissions:
      contents: write         # create the release and upload assets
      id-token: write         # sign the build provenance attestation
      attestations: write     # store it

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum ./*.prg ./*.iq ./*.prg.debug.xml > SHA256SUMS

      # Signed statement that these files came from this workflow run at this
      # commit. Check a download with `gh attestation verify <file> -R <repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.prg
            dist/*.iq

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, because it only needs the artifact. gh
          # otherwise asks git which repository it is in, and stops with
          # 'not a git repository'. GH_REPO names the target instead.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          STORE_READY: ${{ needs.build.outputs.store_ready }}
        run: |
          set -euo pipefail
          if [[ "$STORE_READY" == "true" ]]; then
            iq_note='Signed with the project developer key, so it can be uploaded to the Connect IQ Store.'
          else
            iq_note='Built with an ephemeral CI key because the GARMIN_DEVELOPER_KEY secret is not set, so it **cannot** be uploaded to the Store as an update to an existing listing. The .prg files above are unaffected.'
          fi
          {
            echo "Widget builds from \`$TAG\`."
            echo
            echo "### Install on a device"
            echo
            echo "Download the \`.prg\` for your Edge and copy it to \`GARMIN/APPS\`"
            echo "over USB, then eject. Sideloaded builds are signed with a"
            echo "throwaway key; that is fine for the device and does not affect"
            echo "a Store install of the same app."
            echo
            echo "You still need to set the proxy URL and key in the widget's"
            echo "settings. These builds have no credentials baked in."
            echo
            echo "### Store bundle"
            echo
            echo "\`*.iq\` is the Connect IQ Store package, not a sideloadable file."
            echo "$iq_note"
            echo
            echo "\`*.prg.debug.xml\` is the symbol map for the matching build."
            echo "Attach it to a bug report if the app crashes. A release build"
            echo "strips debug info, so the stack trace in \`GARMIN/APPS/LOGS/CIQ_LOG.YML\`"
            echo "cannot be decoded without it."
            echo
            echo "\`SHA256SUMS\` lists the checksum of every file. Each package also"
            echo "has a build provenance attestation: \`gh attestation verify <file> -R $GH_REPO\`."
            echo
            echo "See [CHANGELOG.md](CHANGELOG.md) for what changed."
          } > /tmp/notes.md

          # Named globs rather than dist/*, so a stray file in the artifact
          # cannot reach a release. The .prg.debug.xml is kept deliberately – it
          # is the symbol map for that exact build, and a release .prg (-r
          # strips debug info) produces stack traces in CIQ_LOG.YML that cannot
          # be decoded without it. It is not reproducible after the fact.
          shopt -s nullglob
          assets=(dist/*.prg dist/*.iq dist/*.prg.debug.xml dist/SHA256SUMS)
          printf 'Attaching %d assets:\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"

          # Idempotent: re-running workflow_dispatch on the same tag replaces the
          # assets and the notes (store_ready may have changed). --verify-tag:
          # never let gh create a missing tag on the default branch, which would
          # attach these assets to a different commit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag \
              --title "$TAG" --notes-file /tmp/notes.md
          fi
