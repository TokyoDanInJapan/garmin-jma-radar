name: widgets

# Build and unit-test both Connect IQ widgets. Until this existed, roughly half
# the codebase – ~2,000 lines of Monkey C, including 48 unit tests – was only
# ever checked by hand on a developer machine.
#
# Deliberately NOT path-filtered at the workflow level: a required status check
# that never runs on an unrelated PR blocks that PR forever. Instead, `changes`
# decides, and `build` is skipped (which counts as passing) when a PR touches
# nothing the widgets depend on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in progress. Runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      widgets: ${{ steps.diff.outputs.widgets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE" ]]; then
            echo "widgets=true" >> "$GITHUB_OUTPUT"   # push or manual run: always build
            exit 0
          fi
          changed=$(git diff --name-only "$BASE...HEAD")
          printf '%s\n' "$changed"
          if grep -qE '^(radar-widget|speedtest-widget|scripts|\.github)/' <<<"$changed"; then
            echo "widgets=true" >> "$GITHUB_OUTPUT"
          else
            echo "widgets=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.widgets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The simulator links libwebkit2gtk-4.0 / libjavascriptcoregtk-4.0, which
    # Ubuntu dropped after 22.04 – the same reason setup.sh provisions a 22.04
    # distrobox for local development. ubuntu-latest alone cannot run it.
    # Pinned by digest (the multi-arch index for ubuntu:22.04), so the image
    # can't change under a build. Update it with the digest from
    # `docker buildx imagetools inspect ubuntu:22.04`, here and in release.yml.
    container: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    # Container jobs default to `sh -e {0}`, not bash, so `set -o pipefail` and
    # `[[ ]]` in the steps below would fail to parse.
    defaults:
      run:
        shell: bash
    env:
      # GitHub sets HOME=/github/home in container jobs, but monkeyc is a Java
      # program and resolves its SDK/device root from the passwd entry for uid 0,
      # that is, /root. Left alone, the toolchain installs to /github/home and the
      # compiler looks in /root, which surfaces as "Invalid device id" rather
      # than anything about paths. Pin both to the same place.
      HOME: /root

    steps:
      # Runs before checkout on purpose: the bare image has no git, and without
      # it actions/checkout silently degrades to a REST tarball download.
      - name: Install toolchain dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git jq unzip openssl \
            openjdk-17-jre-headless \
            libwebkit2gtk-4.0-37 libusb-1.0-0 libsm6 \
            xvfb procps
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-connectiq

      # Every <iq:product> in each manifest, at typecheck level 1 with warnings
      # treated as errors. Both widgets are clean at -w today, so any new warning
      # is a regression. Levels 2 and 3 currently surface ~360 "untyped member"
      # findings across the two widgets – worth doing, but it is an annotation
      # project, not a gate we can turn on now (see CONTRIBUTING.md).
      - name: Compile widgets (all products, warnings are errors)
        run: |
          set -euo pipefail
          key=~/.Garmin/ConnectIQ/ci-key.der
          status=0
          for widget in radar-widget speedtest-widget; do
            devices=$(sed -nE 's/.*<iq:product id="([^"]+)".*/\1/p' "$widget/manifest.xml")
            for device in $devices; do
              echo "::group::$widget -> $device"
              log=$(mktemp)
              if ! (cd "$widget" && monkeyc -d "$device" -w -l 1 \
                      -f monkey.jungle -o "bin/ci-$device.prg" -y "$key") >"$log" 2>&1; then
                status=1
              fi
              cat "$log"
              if grep -qE '^(WARNING|ERROR)' "$log"; then
                echo "::error::$widget/$device produced compiler diagnostics"
                status=1
              fi
              echo "::endgroup::"
            done
          done
          exit $status

      - name: Run Monkey C unit tests
        run: .github/scripts/test-widgets.sh ~/.Garmin/ConnectIQ/ci-key.der

      # Last step before the upload, so it also covers ci-test.prg. Same check the
      # release runs before publishing – a credential must not reach either.
      # always(): a failing unit test must not skip the check, since the upload
      # below still runs then.
      - name: Assert no proxy credential is baked in
        id: creds
        if: always()
        run: .github/scripts/assert-no-credentials.sh radar-widget/bin speedtest-widget/bin

      # Only upload what the check above passed. Plain always() would upload the
      # very artifacts it had just flagged.
      - name: Upload build artifacts
        if: always() && steps.creds.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: widget-prgs
          path: '*/bin/ci-*.prg'
          if-no-files-found: warn
          retention-days: 7
