name: lint

# Static checks that apply to the whole repo rather than one subtree, so this
# runs on every path -- which also makes it safe to mark as a required check
# (see the note in widgets.yml about path-filtered checks deadlocking PRs).
#
# All three checks pass cleanly as of the commit that added them, so any finding
# here is a regression introduced by the change under review, not pre-existing
# debt to negotiate with.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build/deploy/setup scripts do the genuinely error-prone work in this
      # repo -- sed rewriting of properties.xml, trap-based restore, PID liveness
      # polling -- and none of it is covered by a test.
      # shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'Checking %d scripts:\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint -color

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: eslint
        working-directory: proxy
        run: |
          npm ci
          npm run lint
