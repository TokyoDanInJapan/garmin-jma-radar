name: lint

# Static checks that apply to the whole repo rather than one subtree, so this
# runs on every path – which also makes it safe to mark as a required check
# (see the note in widgets.yml about path-filtered checks deadlocking PRs).
# ESLint runs in proxy.yml's test job, which already installs the proxy.
#
# Both checks pass cleanly as of the commit that added them, so any finding
# here is a regression introduced by the change under review, not pre-existing
# debt to negotiate with.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build/deploy/setup scripts do the genuinely error-prone work in this
      # repo – baking secrets into a staged resource copy, device detection, PID
      # liveness polling – and none of it is covered by a test.
      # shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'Checking %d scripts:\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      # Checked against the SHA-256 from the release's checksums file before it
      # is unpacked. Bump both together, and keep the version in sync with
      # .pre-commit-config.yaml.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C /usr/local/bin actionlint
          actionlint -color
