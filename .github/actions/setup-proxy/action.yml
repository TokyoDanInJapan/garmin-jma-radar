name: Set up the proxy
description: Install Node 22 and the proxy's locked dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22            # wrangler v4 requires Node 22+
        cache: npm
        cache-dependency-path: proxy/package-lock.json
    # --ignore-scripts: no dependency's install hook runs, least of all in the
    # deploy job, which holds the Cloudflare token. Nothing here needs one:
    # tests, typecheck, lint and a wrangler bundle all work without them.
    - name: npm ci
      shell: bash
      working-directory: proxy
      run: npm ci --ignore-scripts
